# Installed by the libcamera-loopback package as
# /usr/lib/modprobe.d/libcamera-loopback.conf.
#
# One v4l2loopback device that only advertises CAPTURE while a writer is
# active (exclusive_caps=1, needed by Chrome & co.), labelled to match
# LOOPBACK_LABEL in /etc/default/libcamera-loopback.
#
# max_buffers=3: v4l2loopback grants every reader the writer's buffer count no
# matter what it asked for; apps that only set up what they requested crash
# with more. See the README ("v4l2loopback buffer count").
#
# To change this, copy it to /etc/modprobe.d/libcamera-loopback.conf (which
# takes precedence) and edit it there; then reboot or reload v4l2loopback.
options v4l2loopback devices=1 exclusive_caps=1 card_label="Intel MIPI Camera" max_buffers=3
